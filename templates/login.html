<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE-OS :: AUTHENTICATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Orbitron', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
            background-image: radial-gradient(#111 10%, transparent 10%), radial-gradient(#111 10%, transparent 10%);
            background-size: 20px 20px;
        }
        .login-box {
            border: 2px solid #0f0;
            padding: 40px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 20px #0f0;
            position: relative;
        }
        .login-box::before { content: "RESTRICTED ACCESS"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #000; padding: 0 10px; color: #0f0; }
        input {
            width: 90%; padding: 10px; margin: 10px 0;
            background: #000; border: 1px solid #0f0; color: #0f0;
            font-family: 'Orbitron'; text-align: center;
        }
        input:focus { outline: none; box-shadow: 0 0 10px #0f0; }
        button {
            width: 100%; padding: 10px; background: #0f0; color: #000;
            border: none; font-weight: bold; cursor: pointer; font-family: 'Orbitron';
            margin-top: 10px;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #0f0; }
        .error { color: red; margin-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IDENTIFY YOURSELF</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="USERNAME" required autocomplete="off">
            <input type="password" name="password" placeholder="ACCESS CODE" required>
            <button type="submit">AUTHENTICATE</button>
        </form>
        {% if error %}
        <div class="error">⚠ {{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
